<!-- Byline Block -->
<div class="byline">
  <div class="byline-author">
    <div class="byline-author-image">
      <img class="author-image" loading="lazy">
    </div>
    <div class="byline-author-info">
      <div class="byline-author-name"></div>
      <div class="byline-author-title"></div>
    </div>
  </div>
  <div class="byline-meta">
    <div class="byline-date"></div>
    <div class="byline-reading-time"></div>
  </div>
</div>
